; Réglages PHP de production pour Palabre (complète php.ini-production)
expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 256M
; Pas de téléversement de fichiers dans l'application : on garde les limites basses
file_uploads = Off
post_max_size = 8M
max_execution_time = 30
; Le code compilé reste en mémoire ; les fichiers ne changent qu'avec une nouvelle image
opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
