# Contrôles automatiques à chaque envoi sur GitHub : tests de l'API sur une vraie base PostgreSQL,
# style du code PHP, types TypeScript, analyse du code et compilation du front-end.
name: Contrôles

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API Laravel (tests et style)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: palabre_test
          POSTGRES_USER: palabre
          POSTGRES_PASSWORD: palabre
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U palabre -d palabre_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: palabre
      DB_PASSWORD: palabre
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, bcmath, zip
          coverage: none
      - name: Dépendances
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Configuration de test
        run: cp .env.example .env && php artisan key:generate
      - name: Style du code (Laravel Pint)
        run: ./vendor/bin/pint --test
      - name: Tests de l'API
        run: php artisan test
      - name: Failles connues dans les dépendances
        run: composer audit

  front:
    name: Front-end React (types, analyse, compilation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Analyse du code (oxlint)
        run: npx oxlint src
      - name: Types et compilation
        run: npm run build
